<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <title>Admin - Restaurace</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .topbar{
      display:flex;
      justify-content: space-between;
      align-items:flex-start;
      gap: 10px;
      margin: 10px 0 15px 0;
    }
    .rightTop{
      display:flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 6px;
      min-width: 260px;
    }
    .recache-status{
      font-size: 12px;
      color: #0b7a0b;
      min-height: 16px;
      text-align: right;
    }

    .row { display:flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .section { background:#fff; border:1px solid #ddd; border-radius: 8px; padding: 12px 14px; margin: 12px 0; }
    .muted { color:#666; font-size: 13px; }
    .ok { color:#0b7a0b; }

    input[type="text"], select {
      padding: 8px;
      border: 1px solid #bbb;
      border-radius: 6px;
      width: 100%;
      max-width: 520px;
    }
    select { max-width: 420px; }

    .btn { padding: 8px 12px; border: 1px solid #bbb; background: #e6e6e6; border-radius: 6px; cursor:pointer; }
    .btn:hover { background:#dcdcdc; }

    .danger { background:#b00020; border-color:#7a0016; color:#fff; }
    .danger:hover { background:#8b0019; }

    .restaurantRow{
      display:flex;
      justify-content: space-between;
      gap: 12px;
      align-items: flex-start;
    }

    .leftCol { flex: 1; min-width: 260px; }
    .actionsRight { display:flex; gap: 8px; align-items: center; }

    .modeBox { display:flex; gap: 8px; align-items:center; flex-wrap: wrap; margin-top: 6px; }

    .modeBtn{
      padding: 6px 10px;
      border: 1px solid #bbb;
      background: #e6e6e6;
      border-radius: 20px;
      cursor:pointer;
    }
    .modeBtn:hover{ background:#dcdcdc; }

    .modeActive{
      background:#b9e4b9 !important;
      border-color:#7ac77a !important;
    }

    .tag{
      display:inline-block;
      font-size: 12px;
      padding: 2px 8px;
      border-radius: 999px;
      border: 1px solid #ddd;
      background: #f5f5f5;
      margin-left: 6px;
      color:#333;
    }
  </style>
</head>
<body>

<h2>Admin – Restaurace</h2>

<div class="topbar">
  <button class="btn" onclick="goBack()">← Zpět na menu</button>

  <div class="rightTop">
    <div style="display:flex; gap:10px; align-items:center;">
      <button class="btn" id="btnApplyUpdates" onclick="applyPendingUpdates()" disabled>Update</button>
      <button class="btn" onclick="reCacheAll()">ReCache</button>
    </div>
    <div id="recacheStatus" class="recache-status"></div>
  </div>
</div>

<div class="section">
  <h3>Přidat restauraci</h3>
  <div class="row">
    <input type="text" id="name" placeholder="Název restaurace" />
    <input type="text" id="url" placeholder="URL menu (HTML/PDF/obrázek)" />
    <select id="mode">
      <option value="parse" selected>Parsovat HTML (zkusit vyčíst jídla a ceny)</option>
      <option value="embed">Zobrazit zdroj (iframe/popup) – bez parsování</option>
    </select>
  </div>
  <div class="row">
    <button class="btn" onclick="addRestaurant()">Uložit</button>
    <span id="status" class="muted"></span>
  </div>
  <div class="muted">
    Tip: Pro weby se složitou strukturou (cookie/18+/dynamika) použij „Zobrazit zdroj“.
  </div>
</div>

<div class="section">
  <h3>Návrhy restaurací</h3>
  <div id="suggestions" class="muted">Načítám…</div>
</div>

<div class="section">
  <h3>Seznam restaurací</h3>
  <div id="list" class="muted">Načítám…</div>
</div>

<script>
const PASSWORD = "H3510";

const entered = prompt("Zadej heslo:");
if (entered !== PASSWORD) {
  alert("Špatné heslo");
  window.location.href = "/";
}

function goBack() {
  window.location.href = "/";
}

const statusEl = document.getElementById("status");
const listEl = document.getElementById("list");
const suggestionsEl = document.getElementById("suggestions");
const recacheStatusEl = document.getElementById("recacheStatus");

const LS_MENU_CACHE_TODAY = "menu03_menu_cache_today";
const LS_MENU_CACHE_ALL = "menu03_menu_cache_all";
const LS_MENU_CACHE_DATE_TODAY = "menu03_menu_cache_date_today";
const LS_MENU_CACHE_DATE_ALL = "menu03_menu_cache_date_all";
const LS_RESTAURANTS_SIG = "menu03_restaurants_sig";

const pendingModeById = new Map();

const btnApplyUpdates = document.getElementById("btnApplyUpdates");

function updatePendingButton() {
  if (!btnApplyUpdates) return;
  const n = pendingModeById.size;
  btnApplyUpdates.disabled = n === 0;
  btnApplyUpdates.textContent = n ? `Update (${n})` : "Update";
}

function setStatus(msg, isOk=false) {
  statusEl.textContent = msg || "";
  statusEl.className = "muted" + (isOk ? " ok" : "");
}

function setRecacheStatus(msg) {
  recacheStatusEl.textContent = msg || "";
}

function normalizeMode(mode) {
  const m = String(mode || "").toLowerCase();
  return m === "embed" ? "embed" : "parse";
}

function clearLocalCacheOnly() {
  try {
    localStorage.removeItem(LS_MENU_CACHE_TODAY);
    localStorage.removeItem(LS_MENU_CACHE_ALL);
    localStorage.removeItem(LS_MENU_CACHE_DATE_TODAY);
    localStorage.removeItem(LS_MENU_CACHE_DATE_ALL);
    localStorage.removeItem(LS_RESTAURANTS_SIG);
  } catch {}
}

async function reCacheAll() {
  setRecacheStatus("Čistím cache…");
  try {
    const resp = await fetch("/api/recache", { method: "POST" });
    const data = await resp.json().catch(() => ({}));
    if (!resp.ok) {
      setRecacheStatus("ReCache selhal: " + (data.error || resp.status));
      return;
    }
    clearLocalCacheOnly();
    setRecacheStatus("Hotovo ✅");
  } catch (e) {
    setRecacheStatus("ReCache selhal: " + (e?.message || e));
  }
}

async function addRestaurant() {
  const name = document.getElementById("name").value.trim();
  const url = document.getElementById("url").value.trim();
  const mode = normalizeMode(document.getElementById("mode").value);

  if (!name || !url) {
    alert("Vyplň název i URL.");
    return;
  }

  setStatus("Ukládám…");

  const resp = await fetch("/api/restaurants", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ action: "add", name, url, mode })
  });

  const data = await resp.json().catch(() => ({}));
  if (!resp.ok) {
    setStatus("Uložení selhalo: " + (data.error || resp.status), false);
    return;
  }

  clearLocalCacheOnly();
  setStatus("Uloženo ✅ (cache invalidována automaticky)", true);

  document.getElementById("name").value = "";
  document.getElementById("url").value = "";

  await loadRestaurants();
}

async function deleteRestaurant(id, name) {
  if (!confirm("Opravdu smazat: " + name + "?")) return;
  setStatus("Mažu…");
  const resp = await fetch("/api/restaurants?id=" + encodeURIComponent(id), { method: "DELETE" });
  const data = await resp.json().catch(() => ({}));
  if (!resp.ok) {
    setStatus("Nepodařilo se smazat: " + (data.error || resp.status), false);
    return;
  }
  clearLocalCacheOnly();
  setStatus("Smazáno ✅", true);
  await loadRestaurants();
}

function pickMode(id, mode) {
  pendingModeById.set(id, normalizeMode(mode));
  updatePendingButton();
  loadRestaurants();
}

async function applyPendingUpdates() {
  if (pendingModeById.size === 0) return;

  if (!confirm(`Uložit změny pro ${pendingModeById.size} restaurací?`)) return;

  setStatus("Ukládám změny…");

  const entries = Array.from(pendingModeById.entries());
  for (const [id, mode] of entries) {
    const resp = await fetch("/api/restaurants", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ action: "update", id, mode })
    });

    const data = await resp.json().catch(() => ({}));
    if (!resp.ok) {
      setStatus("Update selhal: " + (data.error || resp.status), false);
      return;
    }
  }

  clearLocalCacheOnly();
  setStatus("Update hotový ✅ (cache invalidována)", true);

  pendingModeById.clear();
  updatePendingButton();
  await loadRestaurants();
}

// zpětná kompatibilita (kdyby někde zůstalo volání)
async function updateRestaurantMode(id) {
  pendingModeById.set(id, pendingModeById.get(id) || "parse");
  updatePendingButton();
  return applyPendingUpdates();
}

async function loadRestaurants() {
  setStatus("");

  const resp = await fetch("/api/restaurants", { method: "GET" });
  const data = await resp.json().catch(() => ({}));

  if (!resp.ok) {
    listEl.innerHTML = `<div class="muted">Chyba: GET /api/restaurants ${resp.status}</div>`;
    return;
  }

  const restaurants = Array.isArray(data?.restaurants) ? data.restaurants : [];

  if (!restaurants.length) {
    listEl.innerHTML = `<div class="muted">Žádné restaurace.</div>`;
    updatePendingButton();
    return;
  }

  listEl.innerHTML = restaurants.map(r => {
    const pending = pendingModeById.get(r.id);
    const effectiveMode = pending || normalizeMode(r.mode);

    const parseActive = effectiveMode === "parse" ? "modeActive" : "";
    const embedActive = effectiveMode === "embed" ? "modeActive" : "";

    const tag = `<span class="tag">${escapeHtml(normalizeMode(r.mode))}</span>`;

    return `
      <div class="restaurantRow">
        <div class="leftCol">
          <div><strong>${escapeHtml(r.name)}</strong> ${tag}</div>
          <div class="muted">${escapeHtml(r.url)}</div>

          <div class="modeBox">
            <span class="muted">Mode:</span>
            <button class="modeBtn ${parseActive}" onclick="pickMode('${escapeHtmlAttr(r.id)}','parse')">Parse</button>
            <button class="modeBtn ${embedActive}" onclick="pickMode('${escapeHtmlAttr(r.id)}','embed')">Embed</button>
            <span class="muted">→ změny se uloží tlačítkem Update nahoře</span>
          </div>
        </div>

        <div class="actionsRight">
          <button class="danger" onclick="deleteRestaurant('${escapeHtmlAttr(r.id)}', '${escapeHtmlAttr(r.name)}')">Smazat</button>
        </div>
      </div>
      <hr>
    `;
  }).join("");

  await loadSuggestions();
  updatePendingButton();
}

async function loadSuggestions() {
  const resp = await fetch("/api/suggestions", { method: "GET" });
  const data = await resp.json().catch(() => ({}));
  if (!resp.ok) {
    suggestionsEl.innerHTML = `<div class="muted">Chyba: GET /api/suggestions ${resp.status}</div>`;
    return;
  }

  const items = Array.isArray(data?.items) ? data.items : [];
  if (!items.length) {
    suggestionsEl.innerHTML = `<div class="muted">Žádné návrhy.</div>`;
    return;
  }

  suggestionsEl.innerHTML = items.map(s => {
    const name = s?.name || "";
    const url = s?.url || "";
    const contact = s?.contact || "";
    const id = s?.id || "";

    return `
      <div style="display:flex; justify-content:space-between; gap:10px; align-items:flex-start;">
        <div>
          <div><strong>${escapeHtml(name)}</strong></div>
          <div class="muted">${escapeHtml(url)}</div>
          <div class="muted">${escapeHtml(contact)}</div>
        </div>
        <div>
          <button class="danger" onclick="deleteSuggestion('${escapeHtmlAttr(id)}')">Smazat</button>
        </div>
      </div>
      <hr>
    `;
  }).join("");
}

async function deleteSuggestion(id) {
  if (!confirm("Smazat návrh?")) return;
  const resp = await fetch("/api/suggestions?id=" + encodeURIComponent(id), { method: "DELETE" });
  const data = await resp.json().catch(() => ({}));
  if (!resp.ok) {
    alert("Smazání selhalo: " + (data.error || resp.status));
    return;
  }
  await loadSuggestions();
}

function escapeHtml(str) {
  return String(str || "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}
function escapeHtmlAttr(str) { return escapeHtml(str); }

loadRestaurants();
loadSuggestions();
</script>

</body>
</html>
