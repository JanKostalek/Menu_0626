<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <title>N&aacute;vrh restaurace</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .suggest-page {
      max-width: 980px;
      margin: 0 auto;
      padding: 24px 18px 28px;
    }

    .suggest-header {
      margin-bottom: 14px;
    }

    .suggest-title {
      margin: 0;
      font-size: clamp(34px, 5vw, 54px);
      font-weight: 800;
      text-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }

    .suggest-subtitle {
      margin: 8px 0 0;
      font-size: 16px;
      color: var(--muted);
      max-width: 760px;
    }

    .suggest-card {
      padding: 20px;
      border-radius: 18px;
    }

    .suggest-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 10px;
    }

    .suggest-input,
    .suggest-note {
      width: 100%;
      min-height: 48px;
      padding: 12px 14px;
      border: 1px solid var(--border-strong);
      border-radius: 12px;
      background: rgba(8, 14, 26, 0.45);
      color: #f0f5ff;
      font-size: 16px;
    }

    .suggest-note {
      min-height: 108px;
      resize: vertical;
      line-height: 1.4;
    }

    .suggest-input::placeholder,
    .suggest-note::placeholder {
      color: #9fb1d5;
    }

    .suggest-input:focus,
    .suggest-note:focus {
      outline: none;
      border-color: rgba(92, 225, 230, 0.86);
      box-shadow: 0 0 0 4px rgba(92, 225, 230, 0.16);
    }

    .suggest-note-wrap {
      margin-bottom: 10px;
    }

    .suggest-actions {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-top: 4px;
    }

    .suggest-btn {
      min-height: 44px;
      padding: 10px 16px;
      border: 1px solid var(--border-strong);
      border-radius: 12px;
      background: linear-gradient(180deg, rgba(34, 54, 95, 0.95), rgba(21, 35, 63, 0.95));
      color: #ecf4ff;
      font-weight: 700;
      cursor: pointer;
    }

    .suggest-btn:hover {
      box-shadow: var(--shadow-sm);
      transform: translateY(-1px);
    }

    .suggest-btn-primary {
      background: linear-gradient(180deg, #53f29a 0%, #2ac17a 100%);
      border-color: rgba(133, 255, 190, 0.8);
      color: #062012;
    }

    .hint {
      color: var(--muted);
      font-size: 14px;
      margin: 4px 0 12px;
    }

    .error {
      color: #ff8ca5;
      font-size: 14px;
      margin-top: 12px;
      font-weight: 700;
    }

    .ok {
      color: #93f8c5;
      font-size: 14px;
      margin-top: 12px;
      font-weight: 700;
    }

    @media (max-width: 760px) {
      .suggest-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main class="suggest-page">
    <header class="suggest-header">
      <h1 class="suggest-title">N&aacute;vrh restaurace</h1>
      <p class="suggest-subtitle">
        Vyplň prosím název restaurace a email. Ostatní údaje jsou volitelné.
      </p>
    </header>

    <section class="card suggest-card">
      <div class="suggest-grid">
        <input id="name" class="suggest-input" type="text" placeholder="Název restaurace *" />
        <input id="menuUrl" class="suggest-input" type="text" placeholder="Adresa jídelního lístku (URL)" />
        <input id="submitter" class="suggest-input" type="text" placeholder="Zadavatel (jméno)" />
        <input id="email" class="suggest-input" type="email" placeholder="Email kontakt *" />
      </div>

      <div class="suggest-note-wrap">
        <textarea id="note" class="suggest-note" placeholder="Poznámka / komentář (volitelné)"></textarea>
      </div>

      <div class="suggest-actions">
        <button class="suggest-btn suggest-btn-primary" onclick="submitSuggestion()">Odeslat návrh</button>
        <button class="suggest-btn" onclick="window.close()">Zavřít</button>
      </div>

      <div id="msg" class="hint"></div>
    </section>
  </main>

  <script>
    function isValidEmail(email) {
      return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(email || "").trim());
    }

    async function submitSuggestion() {
      const name = document.getElementById("name").value.trim();
      const menuUrl = document.getElementById("menuUrl").value.trim();
      const submitter = document.getElementById("submitter").value.trim();
      const email = document.getElementById("email").value.trim();
      const note = document.getElementById("note").value.trim();

      const msg = document.getElementById("msg");
      msg.className = "error";
      msg.textContent = "";

      if (!name) {
        msg.textContent = "Chybí název restaurace.";
        return;
      }
      if (!email) {
        msg.textContent = "Chybí email.";
        return;
      }
      if (!isValidEmail(email)) {
        msg.textContent = "Email nevypadá správně.";
        return;
      }

      msg.className = "hint";
      msg.textContent = "Odesílám…";

      const resp = await fetch("/api/suggestions", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          name,
          menuUrl,
          submitter,
          email,
          note,
          comment: note,
          text: note,
          message: note
        })
      });

      const data = await resp.json().catch(() => ({}));
      if (!resp.ok) {
        msg.className = "error";
        msg.textContent = "Nepodařilo se uložit: " + (data.error || resp.status);
        return;
      }

      msg.className = "ok";
      msg.textContent = "Uloženo. Návrh se objeví v administraci.";

      document.getElementById("name").value = "";
      document.getElementById("menuUrl").value = "";
      document.getElementById("submitter").value = "";
      document.getElementById("email").value = "";
      document.getElementById("note").value = "";
    }
  </script>
</body>
</html>
